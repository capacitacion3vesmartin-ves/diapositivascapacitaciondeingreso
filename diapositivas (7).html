<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ver diapositivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#10a43a;--gd:#06621c;--tx:#13302a;--mu:#5b6f66;--bd:#cfe9d6}
*{box-sizing:border-box}
body{margin:0;padding-top:46px;color:var(--tx);font:15px/1.4 Poppins,"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;background:linear-gradient(180deg,#e6f7ff 0,#f3fff1 38%,#fff8e4 100%) fixed}
button,input,textarea{font:inherit}
#app{max-width:1100px;margin:0 auto;padding:22px 18px 150px}
.bn{position:fixed;top:0;left:0;right:0;z-index:70;background:linear-gradient(135deg,#0fb43f,#06821f);color:#fff;text-align:center;font-weight:800;letter-spacing:1.2px;font-size:17px;padding:8px 12px;box-shadow:0 3px 10px rgba(0,60,20,.18);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px}
.vl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.bti{flex:1;min-width:max-content}
.vb{background:#fff;color:var(--gd);text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.3px;padding:6px 14px;border:0;border-radius:20px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.2)}
h1{margin:6px 0 4px;font-size:28px;text-align:center}.sub{text-align:center;color:var(--mu);margin:0 0 24px;font-weight:600}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:600px;margin:0 auto}
.sd{display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:20px;color:#fff;cursor:pointer;text-align:left;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.22);transition:.15s;font-weight:800;font-size:17px}
.sd:hover{transform:translateY(-3px)}.sd:active{transform:translateY(1px)}
.sd i{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.sd small{display:block;font-weight:600;opacity:.9;font-size:12px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{border-radius:22px;padding:7px 16px;font-weight:800;color:#fff;background:var(--c)}
.bt{border:0;border-radius:14px;padding:9px 16px;font-weight:700;color:#fff;background:var(--g);cursor:pointer;box-shadow:0 3px 0 #0a6a24}
.bt.w{background:#fff;color:var(--tx);box-shadow:0 3px 0 rgba(0,0,0,.18);border:2px solid var(--bd)}.bt.r{background:#e11d48;box-shadow:0 3px 0 #9f1239}.bt:disabled{opacity:.6;cursor:wait}
.mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff8d6;border:2px dashed #e5b800;border-radius:14px;padding:8px 14px;margin-bottom:18px;font-weight:700;font-size:13px;color:#7a5d00}.mbar .sp{flex:1}
.sec{background:#fff;border-radius:20px;margin-bottom:20px;overflow:hidden;border:3px solid var(--c);box-shadow:0 6px 16px rgba(0,60,20,.08)}
.sh{display:flex;align-items:center;gap:10px;background:var(--c);color:#fff;padding:11px 18px;font-weight:800;font-size:17px;letter-spacing:.4px;text-transform:uppercase}
.sh .n{margin-left:auto;font-size:12px;opacity:.9;letter-spacing:0;text-transform:none}
.sh .add{border:0;border-radius:12px;background:#fff;color:var(--c);font-weight:800;padding:5px 12px;cursor:pointer;font-size:13px;text-transform:none;letter-spacing:0}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:16px}
.it{position:relative;border:2px solid #e3eee6;border-left:7px solid var(--c);border-radius:14px;padding:12px 12px 10px;background:#fcfffd;cursor:pointer;text-align:left;color:var(--tx);font-weight:700;transition:.15s;min-height:72px}
.it:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.12);border-color:var(--c)}
.it small{display:block;margin-top:4px;font-weight:700;font-size:11.5px;color:var(--c)}.it.nl small{color:#98a39d}
.ic{position:absolute;bottom:7px;right:7px;display:flex;gap:4px}
.ic span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#fff;border:1.5px solid #d5e3d9;color:var(--mu);cursor:pointer}
.ic span:hover{background:var(--c);color:#fff;border-color:var(--c)}.ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.it.m{padding-bottom:42px;min-height:92px}
.emp{padding:20px;color:var(--mu);font-weight:600;text-align:center;grid-column:1/-1}
.st{text-align:center;padding:50px 10px;color:var(--mu);font-weight:700}.st.ld:after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dt 1.2s steps(4,end) infinite}
@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.mbtn{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:7px;border:0;border-radius:22px;background:#111827;color:#fff;font-weight:700;font-size:13px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:.9}
.mbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.md{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,30,20,.55);align-items:center;justify-content:center;padding:16px}
.mc{position:relative;background:#fff;border-radius:22px;border-top:9px solid var(--c,#0e9a22);max-width:500px;width:100%;padding:22px 24px;box-shadow:0 14px 44px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.mc h3{margin:0 0 6px;font-size:21px;padding-right:30px}.mc .tg{display:inline-block;border-radius:14px;padding:3px 12px;background:var(--c,#0e9a22);color:#fff;font-weight:700;font-size:12px;margin-bottom:12px}
.mc .ds{white-space:pre-wrap;color:#33463e;margin:0 0 18px;font-size:14.5px}
.mc .x{position:absolute;right:12px;top:10px;border:0;background:#eef2ef;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:900}
.go{display:block;text-align:center;text-decoration:none;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:15px;color:#fff;background:var(--c,#0e9a22);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.go.off{background:#c8d0cb;box-shadow:none;color:#fff;cursor:default}
.mc label{display:block;font-weight:700;font-size:12.5px;color:var(--mu);margin-top:12px}
.mc input[type=text],.mc input[type=password],.mc textarea{width:100%;margin-top:4px;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;color:var(--tx);background:#fff}
.mc textarea{min-height:92px;resize:vertical}.mc input:focus,.mc textarea:focus{outline:0;border-color:var(--c,#0e9a22)}
.mc .ck{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--tx);margin-top:14px;font-size:13.5px}.mc .ck input{width:18px;height:18px;margin:0}
.mc .fx{display:flex;gap:10px;margin-top:18px}.mc .fx .bt{flex:1;padding:12px}
.ms{min-height:20px;margin-top:10px;font-weight:700;font-size:13px;color:#be123c}.ms.ld{color:var(--mu)}.ms.ld:after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dt 1.2s steps(4,end) infinite}
.pw{position:relative}.pw input{padding-right:64px!important}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-38%);border:0;background:#eef5f0;border-radius:9px;padding:6px 10px;font-weight:700;color:var(--gd);cursor:pointer;font-size:12px}
.tr{display:flex;align-items:center;gap:10px;border:2px solid #e3eee6;border-left:7px solid var(--c);border-radius:12px;padding:8px 10px;margin-top:8px}.tr b{flex:1;font-size:14px}.tr small{color:var(--mu);display:block;font-weight:600;font-size:11.5px}.tr .bt{padding:6px 12px;font-size:12.5px}
.demo{background:#fff8d6;border:2px dashed #e5b800;border-radius:12px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#7a5d00;margin-bottom:16px;text-align:center}
@media(max-width:640px){.sg{grid-template-columns:1fr}.bn{font-size:13px;padding:8px}.vb{font-size:12px;padding:6px 11px}h1{font-size:22px}.ig{grid-template-columns:1fr 1fr;padding:12px;gap:10px}.sh{font-size:15px;padding:10px 12px}}
.sb{display:flex;gap:10px;margin-bottom:18px}.sb input{flex:1;min-width:0;border:2px solid var(--bd);border-radius:14px;padding:10px 14px;background:#fff;color:var(--tx)}.sb input:focus{outline:0;border-color:var(--g)}.sb .bt{display:flex;align-items:center;gap:6px;white-space:nowrap}.sb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.sh{cursor:pointer;user-select:none}.sh .cv{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none;transition:transform .2s}.sh .cv svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sec.cl .cv{transform:rotate(-90deg)}.sec.cl .sh{cursor:pointer}
.nbw{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:3px solid var(--bd);box-shadow:0 -4px 14px rgba(0,60,20,.12)}
.nb{display:flex;gap:4px;padding:7px 8px 9px;overflow-x:auto;scrollbar-width:none}.nb::-webkit-scrollbar{display:none}
.ar{position:absolute;top:0;bottom:0;width:46px;border:0;display:none;align-items:center;cursor:pointer;color:var(--gd);padding:0}
.ar.r{right:0;justify-content:flex-end;padding-right:6px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 55%)}.ar.l{left:0;justify-content:flex-start;padding-left:6px;background:linear-gradient(270deg,rgba(255,255,255,0),#fff 55%)}
.nbw.mr .ar.r,.nbw.ml .ar.l{display:flex}.ar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.ar.r svg{animation:nu 1.2s ease-in-out infinite}@keyframes nu{50%{transform:translateX(5px)}}
.nb button:first-child{margin-left:auto}.nb button:last-child{margin-right:auto}
.nb button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;font-weight:700;font-size:11px;color:var(--c);padding:2px 8px;min-width:78px}
.nb button i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px;background:#fff;border:2px solid var(--c)}
.nb button.on i{background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.22)}.nb button.on{text-decoration:underline;text-underline-offset:3px}
.nr{text-align:center;color:var(--mu);font-weight:700;padding:40px 10px}
</style></head><body>
<div class="bn"><div class="vl"><a class="vb" href="https://capacitacion3vesmartin-ves.github.io/campuscapacitacion/">← Volver al campus</a><span id="bi"></span></div><div class="bti"><span>🎞️</span> VER DIAPOSITIVAS</div></div>
<div id="app"></div>
<button id="mbtn" class="mbtn" data-a="master"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>Master</button>
<div id="md" class="md"></div>
<script>
/* >>> ÚNICO AJUSTE: pega aquí la URL de tu Apps Script (termina en /exec). Si la dejas vacía, la página funciona en MODO DE PRUEBA (datos locales). <<< */
const URL_API='https://script.google.com/macros/s/AKfycbyD59pgFB5F2r27Af4CPUyQ6DA3c6mWbaEMm8RrcOmqW8EX6rcEs4Dnz80oD3ZhscDU/exec';

const SEDES=[['Villa el Salvador','#0a8f2a'],['Puente Piedra','#2563eb'],['Arequipa','#7c3aed'],['Piura','#f58a07']];
const MODS=[['Maderas','#06621c','🌳',4],['Ferretería','#323232','🔧',4],['Sintéticos','#00b8a0','🧪',4],['Proyectos','#0e057c','📐',4],['Optimización','#f58a07','✂️',3],['Documentación','#804450','📄',3],['Facturación','#6a1b9a','🧾',5]];
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(String(u||'').trim());
const IC={ed:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',tr:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>',bl:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 10h2M13 10h2M9 13h2M13 13h2"/></svg>'};

/* ===== Estado ===== */
let SEDE=null,ITEMS=[],ST='idle',TK='',PIN=false,Q='',QD='',FIL='Todos',COL={};
const nrm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
try{TK=sessionStorage.getItem('dp_tk')||''}catch(e){}
const MASTER=()=>!!TK;
const sedeCol=()=>(SEDES.find(s=>s[0]==SEDE)||[0,'#0e9a22'])[1];
const modDe=n=>MODS.find(m=>m[0]==n)||MODS[0];

/* ===== API (Apps Script o modo de prueba local) ===== */
async function api(p){
 if(!URL_API)return mock(p);
 let j;try{const r=await fetch(URL_API,{method:'POST',body:JSON.stringify(p)});j=await r.json()}catch(e){throw new Error('No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.')}
 if(!j.ok){if(j.codigo=='SESION')salirMaster(true);throw new Error(j.error||'Error del servidor')}
 return j}
/* --- Modo de prueba: simula el Apps Script con datos locales (clave: demo · PIN: 0000) --- */
function mdb(){let d=null;try{d=JSON.parse(localStorage.getItem('dp_mock')||'null')}catch(e){}
 if(!d){d=[];SEDES.forEach(s=>MODS.forEach(m=>{for(let i=1;i<=m[3];i++)d.push({id:Math.random().toString(36).slice(2,10),sede:s[0],modulo:m[0],nombre:m[0]+' '+i,descripcion:'Diapositivas del módulo '+m[0]+' '+i+'.',enlace:i==1?'https://www.canva.com/':'',orden:i,estado:'ACTIVO'})}));msave(d)}return d}
const msave=d=>{try{localStorage.setItem('dp_mock',JSON.stringify(d))}catch(e){}};
async function mock(p){await new Promise(r=>setTimeout(r,450));const bad=(m,c)=>{const e=new Error(m);e.codigo=c;throw e},d=mdb(),
 srt=l=>l.sort((a,b)=>a.orden-b.orden);
 if(p.accion=='listar')return{ok:true,items:srt(d.filter(x=>x.sede==p.sede&&x.estado=='ACTIVO'))};
 if(p.accion=='login_master'){if(p.clave!=='demo')bad('Clave incorrecta.');return{ok:true,token:'t-demo'}}
 if(p.accion=='login_pin'){if(p.pin!=='0000')bad('PIN incorrecto.');window._pinok=1;return{ok:true}}
 if(p.accion=='papelera'){if(!window._pinok)bad('Ingresa el PIN','PIN');return{ok:true,items:srt(d.filter(x=>x.sede==p.sede&&x.estado=='OCULTO'))}}
 if(p.accion=='logout')return{ok:true};
 if(p.accion=='pista')return{ok:true,pista:'Día y mes de aniversario ves'};
 if(p.accion=='guardar'){if(!p.token)bad('Sesión vencida','SESION');
  if(p.op=='add'){(p.sede=='TODAS'?SEDES.map(s=>s[0]):[p.sede]).forEach(s=>{const mx=d.filter(x=>x.sede==s&&x.modulo==p.modulo).reduce((a,x)=>Math.max(a,x.orden),0);d.push({id:Math.random().toString(36).slice(2,10),sede:s,modulo:p.modulo,nombre:p.nombre,descripcion:p.descripcion,enlace:p.enlace,orden:mx+1,estado:'ACTIVO'})})}
  else{if(p.op=='hide'&&p.pin!=='0000')bad('PIN incorrecto.');const b=d.find(x=>x.id==p.id);if(!b)bad('No se encontró');d.filter(x=>x.id==b.id||(p.todas&&x.modulo==b.modulo&&x.nombre==b.nombre)).forEach(x=>{if(p.op=='edit'){x.nombre=p.nombre;x.descripcion=p.descripcion;x.enlace=p.enlace}else if(p.op=='hide')x.estado='OCULTO';else if(p.op=='restore')x.estado='ACTIVO'})}
  msave(d);return{ok:true}}
 bad('Acción no válida')}

/* ===== Modal ===== */
function modal(h,col){const m=$('#md');m.innerHTML='<div class="mc" style="--c:'+(col||'#0e9a22')+'">'+h+'</div>';m.style.display='flex';emo(m)}
function cerrar(){$('#md').style.display='none';$('#md').innerHTML=''}
function msg(t,ld){const m=$('#mm');if(m){m.textContent=t;m.style.color='';m.className='ms'+(ld?' ld':'')}}
const emo=el=>{if(window.twemoji)twemoji.parse(el||document.body,{folder:'svg',ext:'.svg'})};
const busy=b=>document.querySelectorAll('#md .fx .bt').forEach(x=>x.disabled=b);

/* ===== Pantallas ===== */
function R(){const a=$('#app'),mb=$('#mbtn'),sl=($('.nb')||{}).scrollLeft||0;mb.style.display=(!MASTER()&&SEDE)?'flex':'none';let h='';
 if(!SEDE){h+='<h1>Diapositivas de capacitación</h1><p class="sub">Elige tu sede</p><div class="sg">'+SEDES.map(s=>'<button class="sd" style="--c:'+s[1]+'" data-a="sede" data-v="'+E(s[0])+'"><i>'+IC.bl+'</i><span>'+E(s[0])+'<small>Sede</small></span></button>').join('')+'</div>'
  +(MASTER()?barra():'')}
 else{h+='<div class="tb"><span class="chip" style="--c:'+sedeCol()+'">'+E(SEDE)+'</span></div>'
  +'<div class="sb"><input id="q" type="text" placeholder="Buscar diapositiva…" value="'+E(QD)+'" autocomplete="off"><button class="bt" data-a="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Buscar</button>'+(Q?'<button class="bt w" data-a="limpiar">Limpiar</button>':'')+'</div>'+(MASTER()?barra():'');
  if(ST=='load')h+='<div class="st ld">Cargando diapositivas</div>';
  else if(ST=='err')h+='<div class="st">No se pudieron cargar las diapositivas.<br><br><button class="bt" data-a="reintentar">Reintentar</button></div>';
  else{const s=MODS.filter(m=>FIL=='Todos'||m[0]==FIL).map(secc).join('');h+=s||'<div class="nr">No se encontraron diapositivas para «'+E(Q)+'».</div>'}
  h+=navb()}
 $('#bi').innerHTML=SEDE?'<button class="vb" data-a="cambiar">← Pantalla de inicio</button>':'';a.innerHTML=h;mb.style.bottom='96px';ajb();emo(a);const nb=$('.nb');if(nb){nb.scrollLeft=sl;nb.onscroll=nbUpd;nbUpd()}}
function nbUpd(){const n=$('.nb');if(!n)return;const w=n.parentNode;w.classList.toggle('mr',n.scrollLeft+n.clientWidth<n.scrollWidth-4);w.classList.toggle('ml',n.scrollLeft>4)}
addEventListener('resize',nbUpd);
function ajb(){const b=$('.bn');if(b)document.body.style.paddingTop=b.offsetHeight+'px'}
addEventListener('resize',ajb);addEventListener('load',ajb);
const AR=d=>'<svg viewBox="0 0 24 24"><path d="'+(d=='r'?'M9 5l7 7-7 7':'M15 5l-7 7 7 7')+'"/></svg>';
const navb=()=>'<div class="nbw"><div class="nb"><button class="'+(FIL=='Todos'?'on':'')+'" style="--c:#0e9a22" data-a="filtro" data-v="Todos"><i>📚</i>Todos</button>'+MODS.map(m=>'<button class="'+(FIL==m[0]?'on':'')+'" style="--c:'+m[1]+'" data-a="filtro" data-v="'+E(m[0])+'"><i>'+m[2]+'</i>'+E(m[0])+'</button>').join('')+'</div><button class="ar l" data-a="nbl" aria-label="Ver anteriores">'+AR('l')+'</button><button class="ar r" data-a="nbr" aria-label="Ver más ciclos">'+AR('r')+'</button></div>';
const barra=()=>'<div class="mbar">🔓 Modo master activo<span class="sp"></span>'+(SEDE?'<button class="bt w" data-a="papelera">🗑 Papelera</button>':'')+'<button class="bt w" data-a="salir">Salir de master</button></div>';
function secc(m){const L=ITEMS.filter(x=>x.modulo==m[0]&&(!Q||nrm(x.nombre+' '+x.descripcion+' '+x.modulo).includes(nrm(Q))));
 if(Q&&!L.length)return '';const cl=!Q&&COL[m[0]];
 return '<div class="sec'+(cl?' cl':'')+'" style="--c:'+m[1]+'"><div class="sh" data-a="col" data-m="'+E(m[0])+'"><span class="cv"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span><span>'+m[2]+'</span>'+E(m[0])+'<span class="n">'+L.length+' diapositiva'+(L.length==1?'':'s')+'</span>'+(MASTER()?'<button class="add" data-a="add" data-m="'+E(m[0])+'">+ Añadir</button>':'')+'</div>'
  +(cl?'':'<div class="ig">'+(L.length?L.map(x=>{const ok=okUrl(x.enlace);return '<div class="it'+(ok?'':' nl')+(MASTER()?' m':'')+'" data-a="ver" data-id="'+E(x.id)+'" tabindex="0">'+E(x.nombre)+'<small>'+(ok?'Ver diapositiva ▸':'Próximamente')+'</small>'+(MASTER()?'<div class="ic"><span data-a="edit" data-id="'+E(x.id)+'" title="Editar">'+IC.ed+'</span><span data-a="quitar" data-id="'+E(x.id)+'" title="Quitar">'+IC.tr+'</span></div>':'')+'</div>'}).join(''):'<div class="emp">Aún no hay diapositivas en este módulo.</div>')+'</div>')+'</div>'}
const item=id=>ITEMS.find(x=>x.id==id);

function ver(id){const x=item(id);if(!x)return;const m=modDe(x.modulo),ok=okUrl(x.enlace);
 modal('<button class="x" data-a="cerrar">✕</button><span class="tg">'+m[2]+' '+E(x.modulo)+'</span><h3>'+E(x.nombre)+'</h3><p class="ds">'+(E(x.descripcion)||'Sin descripción.')+'</p>'
  +(ok?'<a class="go" href="'+E(x.enlace.trim())+'" target="_blank" rel="noopener noreferrer">Ver diapositiva de este módulo</a>':'<span class="go off">Diapositiva disponible próximamente</span>'),m[1])}

/* ===== Cargar ===== */
async function cargar(silencio){if(!silencio){ST='load';R()}
 try{const j=await api({accion:'listar',sede:SEDE});ITEMS=j.items||[];ST='ok'}catch(e){ST='err';if(silencio)alert(e.message)}R()}

/* ===== Master ===== */
function loginM(){modal('<button class="x" data-a="cerrar">✕</button><h3>Acceso master</h3><label>Clave<div class="pw"><input id="mp" type="password" autocomplete="new-password" placeholder="Clave"><button type="button" data-a="ojo" data-v="mp">Ver</button></div></label><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="entrar">Ingresar</button></div>','#111827');setTimeout(()=>{const i=$('#mp');if(i)i.focus()},50)}
async function entrar(){const v=$('#mp').value;if(!v){msg('Escribe la clave.');return}
 msg('Confirmando credenciales',true);busy(true);
 try{const j=await api({accion:'login_master',clave:v});TK=j.token;try{sessionStorage.setItem('dp_tk',TK)}catch(e){}cerrar();R()}
 catch(e){busy(false);msg(e.message);const i=$('#mp');if(i)i.select()}}
function salirMaster(silencio){if(TK&&!silencio)api({accion:'logout',token:TK}).catch(()=>{});TK='';PIN=false;try{sessionStorage.removeItem('dp_tk')}catch(e){}cerrar();R();if(silencio)alert('Tu sesión master venció. Ingresa de nuevo.')}

function form(x,mod){const nuevo=!x,m=modDe(mod);
 modal('<button class="x" data-a="cerrar">✕</button><span class="tg">'+m[2]+' '+E(mod)+'</span><h3>'+(nuevo?'Añadir diapositiva':'Editar diapositiva')+'</h3>'
  +'<label>Nombre<input id="fn" type="text" maxlength="80" value="'+E(x?x.nombre:'')+'" placeholder="Ej. '+E(mod)+' 5"></label>'
  +'<label>Descripción<textarea id="fd" maxlength="600" data-def="'+E(x&&/^Diapositivas del módulo .*\.$/.test(x.descripcion)?x.descripcion:'')+'" placeholder="¿Qué se ve en esta diapositiva?">'+E(x?x.descripcion:'')+'</textarea></label>'
  +'<label>Enlace de Canva<input id="fe" type="text" value="'+E(x?x.enlace:'')+'" placeholder="https://www.canva.com/..."></label>'
  +(nuevo?'<label class="ck"><input type="checkbox" id="ft">Añadir en las 4 sedes</label>':'')
  +'<div id="mm" class="ms"></div>'
  +'<div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="guardar" data-id="'+E(x?x.id:'')+'" data-m="'+E(mod)+'">Guardar</button></div>',m[1]);setTimeout(()=>{const i=$('#fn');if(i)i.focus()},50)}
async function guardar(id,mod){const t=!!($('#ft')&&$('#ft').checked),n=$('#fn').value.trim(),d=$('#fd').value.trim(),e=$('#fe').value.trim();
 if(!n){msg('Escribe un nombre.');return}if(e&&!okUrl(e)){msg('El enlace debe empezar con http:// o https://');return}
 msg('Guardando',true);busy(true);
 try{await api(id?{accion:'guardar',token:TK,op:'edit',id,todas:t,nombre:n,descripcion:d,enlace:e}:{accion:'guardar',token:TK,op:'add',sede:t?'TODAS':SEDE,modulo:mod,nombre:n,descripcion:d,enlace:e});cerrar();await cargar(true)}
 catch(er){busy(false);msg(er.message)}}
function quitar(id){const x=item(id);if(!x)return;
 modal('<button class="x" data-a="cerrar">✕</button><h3>¿Quitar «'+E(x.nombre)+'»?</h3><p class="ds">No se elimina: se esconde y pasa a la <b>papelera</b>, desde donde se puede restaurar con el PIN.</p><label>PIN para quitar<div class="pw"><input id="mp" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN"><button type="button" data-a="ojo" data-v="mp">Ver</button></div></label><button type="button" class="bt w" style="margin-top:10px;padding:6px 12px;font-size:12.5px" data-a="pista">¿Olvidaste el PIN?</button><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt r" data-a="confq" data-id="'+E(id)+'">Quitar</button></div>','#e11d48')}
async function confq(id){const v=(($('#mp')||{}).value||'').trim();if(!v){msg('Escribe el PIN.');return}msg('Quitando',true);busy(true);
 try{await api({accion:'guardar',token:TK,op:'hide',id,pin:v});cerrar();await cargar(true)}catch(er){busy(false);msg(er.message);const i=$('#mp');if(i)i.select()}}
async function pista(){msg('Buscando pista',true);try{const j=await api({accion:'pista',token:TK});msg('💡 Pista: '+j.pista);$('#mm').style.color='#0a6a24'}catch(e){msg(e.message)}}

/* ===== Papelera (PIN) ===== */
function pedirPin(){modal('<button class="x" data-a="cerrar">✕</button><h3>Papelera</h3><p class="ds">Ingresa el PIN para ver las diapositivas quitadas.</p><label>PIN<div class="pw"><input id="mp" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN"><button type="button" data-a="ojo" data-v="mp">Ver</button></div></label><button type="button" class="bt w" style="margin-top:10px;padding:6px 12px;font-size:12.5px" data-a="pista">¿Olvidaste el PIN?</button><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="pin">Entrar</button></div>','#111827');setTimeout(()=>{const i=$('#mp');if(i)i.focus()},50)}
async function pinOk(){const v=$('#mp').value.trim();if(!v){msg('Escribe el PIN.');return}msg('Verificando PIN',true);busy(true);
 try{await api({accion:'login_pin',token:TK,pin:v});PIN=true;await papelera()}catch(e){busy(false);msg(e.message);const i=$('#mp');if(i)i.select()}}
async function papelera(){if(!PIN){pedirPin();return}
 modal('<button class="x" data-a="cerrar">✕</button><h3>🗑 Papelera · '+E(SEDE)+'</h3><div class="st ld">Cargando</div>','#111827');
 try{const j=await api({accion:'papelera',token:TK,sede:SEDE}),L=j.items||[];
  modal('<button class="x" data-a="cerrar">✕</button><h3>🗑 Papelera · '+E(SEDE)+'</h3>'
   +(L.length?L.map(x=>{const m=modDe(x.modulo);return '<div class="tr" style="--c:'+m[1]+'"><b>'+E(x.nombre)+'<small>'+E(x.modulo)+'</small></b><button class="bt" data-a="rest" data-id="'+E(x.id)+'">Restaurar</button></div>'}).join(''):'<p class="ds" style="margin-top:14px">La papelera está vacía.</p>')+'<div id="mm" class="ms"></div>','#111827')}
 catch(e){PIN=false;if(e.message&&!/venci/.test(e.message)){modal('<button class="x" data-a="cerrar">✕</button><h3>Papelera</h3><p class="ds">'+E(e.message)+'</p>','#111827')}}}
async function restaurar(id){msg('Restaurando',true);
 try{await api({accion:'guardar',token:TK,op:'restore',id});await cargar(true);await papelera()}catch(e){msg(e.message)}}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');
 if(!t){if(e.target.id=='md')cerrar();return}
 const a=t.dataset.a,id=t.dataset.id;
 if(a!='ver')e.stopPropagation();
 if(a=='sede'){SEDE=t.dataset.v;ITEMS=[];Q=QD='';FIL='Todos';COL={};cargar()}
 else if(a=='cambiar'){SEDE=null;ITEMS=[];ST='idle';Q=QD='';FIL='Todos';R()}
 else if(a=='nbr'||a=='nbl'){$('.nb').scrollBy({left:a=='nbr'?220:-220,behavior:'smooth'})}
 else if(a=='buscar')buscar()
 else if(a=='limpiar'){Q=QD='';R()}
 else if(a=='filtro'){FIL=t.dataset.v;R();scrollTo(0,0)}
 else if(a=='col'){const k=t.dataset.m;COL[k]=!COL[k];R()}
 else if(a=='reintentar')cargar()
 else if(a=='ver'){if(e.target.closest('.ic'))return;ver(id)}
 else if(a=='cerrar')cerrar()
 else if(a=='master')loginM()
 else if(a=='entrar')entrar()
 else if(a=='salir')salirMaster()
 else if(a=='ojo'){const i=$('#'+t.dataset.v);i.type=i.type=='password'?'text':'password'}
 else if(a=='add')form(null,t.dataset.m)
 else if(a=='edit'){const x=item(id);if(x)form(x,x.modulo)}
 else if(a=='guardar')guardar(id,t.dataset.m)
 else if(a=='quitar')quitar(id)
 else if(a=='confq')confq(id)
 else if(a=='papelera')papelera()
 else if(a=='pin')pinOk()
 else if(a=='rest')restaurar(id)
 else if(a=='pista')pista()});
function buscar(){const i=$('#q');Q=(i?i.value:'').trim();QD=Q;R()}
document.addEventListener('input',e=>{if(e.target.id=='q')QD=e.target.value});
document.addEventListener('focusin',e=>{const t=e.target;if(t.id=='fd'&&t.dataset.def&&t.value===t.dataset.def)t.value=''});
document.addEventListener('focusout',e=>{const t=e.target;if(t.id=='fd'&&t.dataset.def&&!t.value.trim())t.value=t.dataset.def});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cerrar();if(e.key=='Enter'&&e.target.id=='q'){buscar();return}
 if(e.key=='Enter'){const m=$('#md');if(m.style.display=='flex'&&e.target.id=='mp'){const b=m.querySelector('[data-a="entrar"],[data-a="pin"],[data-a="confq"]');if(b)b.click()}
  else if(e.target.classList&&e.target.classList.contains('it'))e.target.click()}});
R();
</script>
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.0.0/dist/twemoji.min.js" onload="window.twemoji&&twemoji.parse(document.body,{folder:'svg',ext:'.svg'})"></script>
</body></html>
